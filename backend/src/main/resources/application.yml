server:
  port: 8085
spring:
  datasource:
    # 本機開發預設 localhost；Docker Compose 透過環境變數 SPRING_DATASOURCE_URL 覆蓋為 db:5432
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinemist}
    username: ${SPRING_DATASOURCE_USERNAME:cinemist}
    password: ${SPRING_DATASOURCE_PASSWORD:cinemist}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
  sql:
    init:
      mode: always
