name: Deploy to Render

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "⚠️  RENDER_BACKEND_DEPLOY_HOOK not set — skipping"
            exit 0
          fi
          curl -fS "$HOOK"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render frontend deploy
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "⚠️  RENDER_FRONTEND_DEPLOY_HOOK not set — skipping"
            exit 0
          fi
          curl -fS "$HOOK"
