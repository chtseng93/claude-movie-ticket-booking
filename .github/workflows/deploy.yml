name: Deploy to Render

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        run: curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render frontend deploy
        run: curl -s "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
